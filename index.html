<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Sauremiel — digital portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+French+Canon+SC&family=Italianno&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <section class="hero" id="about">
    <img class="hero__bg" src="assets/banner.png" alt="">
    <img class="hero__line hero__line--top" src="assets/divider-title.svg" alt="">
    <h1 class="hero__title">SAUREMIEL</h1>
    <p class="hero__sub">digital portfolio</p>
    <img class="hero__line hero__line--bottom" src="assets/divider-title.svg" alt="">
  </section>

  <section class="info">
    <div class="info__inner">

      <div class="skills-col">
        <div class="skills">
          <h2 class="skills__title">Skills</h2>
          <img class="skills__line" src="assets/divider-skills.svg" alt="">
          <ul class="skills__tags">
            <li class="tag">Digital Design</li>
            <li class="tag">Illustration</li>
            <li class="tag">Concept Art</li>
            <li class="tag">Game Assets</li>
          </ul>
        </div>
        <img class="software" src="assets/software.svg" alt="Software I use">
      </div>

      <ul class="links">
        <li><a class="pill" href="https://www.instagram.com/sauremiel/" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/instagram.svg" alt=""></span><span class="pill__text">Instagram</span></a></li>
        <li><a class="pill" href="https://www.artstation.com/sauremiel" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/artstation.svg" alt=""></span><span class="pill__text">ArtStation</span></a></li>
        <li><a class="pill" href="https://t.me/sauremiel" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/telegram.svg" alt=""></span><span class="pill__text">Telegram</span></a></li>
        <li><a class="pill" href="https://www.tiktok.com/@sauremiel" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/tiktok.svg" alt=""></span><span class="pill__text">TikTok</span></a></li>
        <li><a class="pill" href="https://www.threads.com/@sauremiel" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/threads.svg" alt=""></span><span class="pill__text">Threads</span></a></li>
        <li><a class="pill" href="https://ru.pinterest.com/sauremiel/_profile/" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/pinterest.svg" alt=""></span><span class="pill__text">Pinterest</span></a></li>
        <li><a class="pill" href="https://www.deviantart.com/sauremiel" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/deviantart.svg" alt=""></span><span class="pill__text">DeviantArt</span></a></li>
        <li><a class="pill" href="https://bsky.app/profile/sauremiel.bsky.social" target="_blank" rel="noopener"><span class="pill__icon"><img src="assets/bluesky.svg" alt=""></span><span class="pill__text">BlueSky</span></a></li>
      </ul>

    </div>
  </section>

  <section class="gallery" id="gallery">
    <h2 class="gallery__title">GALLERY</h2>
    <a class="more" href="https://www.artstation.com/sauremiel" target="_blank" rel="noopener">View More <img src="assets/line-arrow.svg" alt=""></a>

    <button class="arrow arrow--prev" type="button" aria-label="Previous"><img src="assets/arrow-prev.svg" alt=""></button>
    <div class="gallery__track" id="track">
      <a class="card" href="#"><img src="assets/gallery-1.png" alt="Gallery artwork 1" decoding="async"></a>
      <a class="card" href="#"><img src="assets/gallery-3.png" alt="Gallery artwork 3" decoding="async"></a>
      <a class="card" href="#"><img src="assets/gallery-2.png" alt="Gallery artwork 2" decoding="async"></a>
      <a class="card" href="#"><img src="assets/gallery-4.png" alt="Gallery artwork 4" loading="lazy" decoding="async"></a>
      <a class="card" href="#"><img src="assets/gallery-5.png" alt="Gallery artwork 5" loading="lazy" decoding="async"></a>
      <a class="card" href="#"><img src="assets/gallery-6.png" alt="Gallery artwork 6" loading="lazy" decoding="async"></a>
    </div>
    <button class="arrow arrow--next" type="button" aria-label="Next"><img src="assets/arrow-next.svg" alt=""></button>
  </section>

</div>

  <script src="script.js"></script>
</body>
</html>
